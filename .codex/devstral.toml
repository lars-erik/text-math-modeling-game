# Devstral-specific configuration
model = "mistral-medium"
reasoning_effort = "high"
startup_grace_ms = 0

[sandbox]
mode = "full-access"
allow_network = false
writable_dirs = ["src", "output"]
exclude_tmp = true

[environment]
inherit_env = true
ignore_default_excludes = false

[agents]
enable_subagents = true
max_threads = 2
subagent_model = "mistral-small"
subagent_reasoning_effort = "medium"